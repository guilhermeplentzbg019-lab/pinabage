<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo Completo | PINABAGE.COM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-stone-950 text-stone-200 antialiased">

    <!-- Header / Navbar -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-stone-950/95 backdrop-blur-md border-b border-stone-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group shrink-0">
                <div class="w-10 h-10 rounded-lg bg-stone-900 border border-amber-500/50 flex items-center justify-center overflow-hidden shadow">
                    <img src="imagens/logo.png" alt="Logo" class="w-full h-full object-contain p-1" onerror="this.src='imagens/logo.jpg'">
                </div>
                <div>
                    <span class="font-serif font-bold text-base text-stone-100 tracking-wider block leading-none">PINABAGE.COM</span>
                    <span class="text-[9px] text-stone-400 uppercase tracking-widest block mt-1">Acervo Completo</span>
                </div>
            </a>
            <a href="index.html" class="px-4 py-2 rounded-lg bg-stone-900 border border-stone-800 text-stone-300 text-xs font-semibold hover:text-amber-400 transition-colors">
                ← Voltar ao Início
            </a>
        </div>
    </header>

    <!-- Galeria Completa -->
    <main class="pt-32 pb-24 max-w-7xl mx-auto px-4">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-6">
            <div>
                <span class="text-amber-500 text-xs font-bold uppercase tracking-widest block mb-2">Catálogo Geral</span>
                <h1 class="text-4xl font-serif font-bold text-stone-100">Todas as Obras do Acervo</h1>
            </div>
            <!-- Filtros -->
            <div class="flex flex-wrap gap-2" id="acervo-filtros">
                <button class="filter-btn active px-4 py-2 rounded-full text-xs font-semibold bg-amber-500 text-stone-950" data-filter="todos">TODOS</button>
                <button class="filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-stone-900 text-stone-300 border border-stone-800" data-filter="gravura">GRAVURAS</button>
                <button class="filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-stone-900 text-stone-300 border border-stone-800" data-filter="pintura">PINTURAS</button>
                <button class="filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-stone-900 text-stone-300 border border-stone-800" data-filter="desenho">DESENHOS</button>
            </div>
        </div>

        <!-- Grade com todas as obras -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="obras-grid"></div>
    </main>

    <!-- Modal para Zoom -->
    <div id="modal" class="fixed inset-0 z-50 bg-black/95 hidden items-center justify-center p-4">
        <div class="bg-stone-900 border border-stone-800 rounded-xl max-w-3xl w-full p-6 relative">
            <button onclick="fecharModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-100 font-bold text-xs uppercase px-3 py-1 bg-stone-800 rounded z-20">Fechar</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer class="py-12 border-t border-stone-800 text-center text-stone-500 text-xs">
        &copy; 2026 PINABAGE.COM — Pinacoteca Municipal Norma Vasconcellos (Bagé - RS)
    </footer>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script>
        function renderGaleria(lista) {
            document.getElementById('obras-grid').innerHTML = lista.map(o => `
                <div class="bg-stone-900 border border-stone-800 rounded-xl overflow-hidden card-art flex flex-col justify-between group">
                    <div>
                        <div class="h-64 bg-stone-950 overflow-hidden relative flex items-center justify-center p-2 cursor-pointer" onclick="abrirZoom('${o.img}', '${o.titulo}', '${o.autor}', '${o.desc}')">
                            <img src="${o.img}" alt="${o.titulo}" class="w-full h-full object-contain transition-transform duration-300 group-hover:scale-105" onerror="this.src='${IMAGEM_PADRAO}'">
                            <span class="absolute top-3 right-3 px-2.5 py-1 bg-stone-950/90 border border-stone-700 text-stone-200 text-[10px] font-bold uppercase rounded">
                                ${o.tipo}
                            </span>
                            <div class="absolute inset-0 bg-stone-950/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <span class="px-4 py-2 bg-amber-500 text-stone-950 font-bold text-xs rounded-lg shadow-lg">🔍 Ver Obra Inteira</span>
                            </div>
                        </div>
                        <div class="p-6">
                            <span class="text-xs font-bold text-amber-500 block mb-1">${o.autor} (${o.ano})</span>
                            <h3 class="text-xl font-serif font-bold text-stone-100 mb-2">${o.titulo}</h3>
                            <p class="text-stone-400 text-xs leading-relaxed line-clamp-2">${o.desc}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        renderGaleria(getObras());

        // Filtros
        document.querySelectorAll('#acervo-filtros .filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('#acervo-filtros .filter-btn').forEach(b => {
                    b.classList.remove('bg-amber-500', 'text-stone-950');
                    b.classList.add('bg-stone-900', 'text-stone-300');
                });
                e.target.classList.remove('bg-stone-900', 'text-stone-300');
                e.target.classList.add('bg-amber-500', 'text-stone-950');
                const f = e.target.getAttribute('data-filter');
                const obras = getObras();
                renderGaleria(f === 'todos' ? obras : obras.filter(o => o.tipo === f));
            });
        });

        const modal = document.getElementById('modal');
        const modalBody = document.getElementById('modal-body');

        function fecharModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modalBody.innerHTML = '';
        }

        function abrirZoom(imgSrc, titulo, autor, desc) {
            modalBody.innerHTML = `
                <div class="text-center">
                    <span class="text-xs font-bold text-amber-500 uppercase">${autor}</span>
                    <h3 class="text-2xl font-serif font-bold text-stone-100 mt-1 mb-4">${titulo}</h3>
                    <div class="max-h-[70vh] bg-stone-950 rounded-lg overflow-hidden flex items-center justify-center p-2 border border-stone-800 mb-4">
                        <img src="${imgSrc}" alt="${titulo}" class="max-h-[65vh] max-w-full object-contain rounded">
                    </div>
                    <p class="text-stone-400 text-xs">${desc}</p>
                </div>
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
    </script>
</body>
</html>
